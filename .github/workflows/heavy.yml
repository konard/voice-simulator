name: Heavy checks

# Tests too slow for every pull request (tests/heavy/README.md). Started by
# hand only: Actions tab -> Heavy checks -> Run workflow, or
#   gh workflow run heavy.yml -f suite=quality -f limit=5
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite of tests/heavy to run
        type: choice
        options:
          - all
          - quality
          - recognition
          - roundtrip
          - copy
          - performance
          - recognition-performance
          - gpu
          - lexicon
          - lowest
        default: all
      ref:
        description: Branch or tag of this repository, or a commit on the default branch or on the branch chosen above, to test (empty = the branch chosen above)
        type: string
        default: ''
      limit:
        description: Largest number of items each test may process (empty = no limit)
        type: string
        default: ''
      recognition-runner:
        description: Recognition performance runner (x64 cold CLI reference or four-core ARM64)
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        default: ubuntu-24.04

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  heavy:
    name: Heavy checks
    runs-on: ${{ inputs.suite == 'recognition-performance' && inputs.recognition-runner || 'ubuntu-24.04' }}
    # The step budgets below own the deadlines. This cap is the backstop
    # behind the longest one (300 minutes), leaving 30 minutes for checkout,
    # install and artifact upload. See docs/CI-TIMEOUT-BUDGETS.md.
    timeout-minutes: 330
    concurrency:
      # Corpus limits and performance runner types can run independently.
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite == 'recognition' && inputs.limit != '' && format('recognition-{0}', inputs.limit) || inputs.suite == 'recognition-performance' && format('recognition-performance-{0}', inputs.recognition-runner) || inputs.suite }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # The branch chosen in the form: always a branch of this repository.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A run started on the default branch writes to its cache scope, so the
      # ref input may only name code of this repository; see the script.
      - name: Resolve the ref to test
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FALLBACK_SHA: ${{ github.sha }}
          WANTED: ${{ inputs.ref }}
        run: bash scripts/resolve-heavy-ref.sh

      - name: Check out the ref to test
        if: ${{ steps.target.outputs.revision != github.sha }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.revision }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      # Suites copy and lowest (issue 81) drive the built example app.
      - name: Install the example app and Playwright Chromium
        if: inputs.suite == 'copy' || inputs.suite == 'lowest' || inputs.suite == 'all'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix examples/universal-app --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Speech datasets fetched by scripts/datasets.mjs (issue 16). The key
      # changes with the registry, so a changed checksum fetches again.
      # The cache stays on the runner side: .datasets/ is never uploaded as
      # an artifact or committed.
      # performance-rust-waveguide.test.js and performance-rust-fdtd.test.js
      # compare the JavaScript renderer with src/engine/voice-simulator.wasm
      # (issues 22 and 23; the second also with the SIMD build, which
      # build-wasm.mjs leaves in target/simd when it is not shipped). The rustup of the
      # runner image installs the toolchain of rust-toolchain.toml.
      # performance-threads.test.js (issue 24) times the native CLI and the
      # threads file, which needs the nightly toolchain of THREADS_TOOLCHAIN.
      # performance-tiers.test.js (issue 31) times every tier on JavaScript
      # and Rust, on one core and (3D tiers) with the threads file, and
      # compares them with docs/reports/performance-baseline.json; the run
      # never commits, see "Heavy checks" in docs/CONTRIBUTING.md.
      - name: Build the WebAssembly engine
        if: inputs.suite == 'performance' || inputs.suite == 'all'
        run: |
          bash scripts/run-with-budget-warning.sh 150 "Rust toolchain install" rustup toolchain install
          THREADS_TOOLCHAIN=$(node --input-type=module -e "import { THREADS_TOOLCHAIN } from './scripts/build-wasm.mjs'; console.log(THREADS_TOOLCHAIN)")
          bash scripts/run-with-budget-warning.sh 150 "nightly toolchain install" rustup toolchain install "$THREADS_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --component rust-src
          bash scripts/run-with-budget-warning.sh 360 "wasm build" node scripts/build-wasm.mjs --require --threads
          bash scripts/run-with-budget-warning.sh 120 "CLI build" cargo build --release --locked -p voice-simulator-cli

      # Suite lowest (issue 81) runs the rust-1 column on this scalar build.
      - name: Build scalar recognition WebAssembly
        if: inputs.suite == 'recognition-performance' || inputs.suite == 'copy' || inputs.suite == 'lowest'
        run: |
          node scripts/build-wasm.mjs --require --check-size
          node scripts/build-recognition-models.mjs

      - name: Check native copy control parity
        if: inputs.suite == 'copy' || inputs.suite == 'all'
        run: |
          cargo build --locked -p voice-simulator-core --example copy_controls
          COPY_NATIVE_PROBE="$PWD/target/debug/examples/copy_controls" node --test tests/copy-rust-parity.test.js

      - name: Restore the speech dataset cache
        uses: actions/cache@v6
        with:
          path: .datasets
          key: datasets-${{ hashFiles('datasets/registry.json') }}

      # Suite gpu (tests/heavy/gpu-*.test.js) runs in Deno, whose WebGPU
      # falls back to Mesa's software OpenGL ES driver on a runner without
      # a GPU (issue 30). REQUIRE_GPU=1 below turns a missing adapter into a
      # failure.
      - name: Install the software OpenGL ES driver
        if: inputs.suite == 'gpu' || inputs.suite == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri

      - name: Setup Deno
        if: inputs.suite == 'gpu' || inputs.suite == 'all'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Show the WebGPU adapter
        if: inputs.suite == 'gpu' || inputs.suite == 'all'
        run: deno run -A scripts/gpu-adapter.mjs

      - name: Run heavy checks
        if: inputs.suite != 'recognition-performance'
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          LIMIT: ${{ inputs.limit }}
          # The inherited golden inversion gate names a decision for its
          # author. Keep the same branch policy as the regular PR tests.
          BLOCKED_GATES: ${{ inputs.suite == 'recognition' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && 'warn' || '' }}
          REQUIRE_GPU: ${{ (inputs.suite == 'gpu' || inputs.suite == 'all') && '1' || '' }}
          REQUIRE_WASM: ${{ (inputs.suite == 'performance' || inputs.suite == 'all') && '1' || '' }}
          REQUIRE_CLI: ${{ (inputs.suite == 'performance' || inputs.suite == 'all') && '1' || '' }}
          REQUIRE_THREADS_WASM: ${{ (inputs.suite == 'performance' || inputs.suite == 'all') && '1' || '' }}
          # Lowest settings: each cell still runs pinned to one core of its
          # own; four at a time fit the step budget (sequentially about 5 h).
          LOWEST_PARALLEL: ${{ (inputs.suite == 'lowest' || inputs.suite == 'all') && '4' || '' }}
        run: |
          limit_flags=()
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            limit_flags=(--limit "$LIMIT")
          fi
          command=(npm run test:heavy -- --suite "$SUITE" "${limit_flags[@]}")
          if [[ "$SUITE" == recognition ]]; then
            core=$(awk '/^Cpus_allowed_list:/ {split($2, allowed, /[-,]/); print allowed[1]}' /proc/self/status)
            bash scripts/run-with-budget-warning.sh 5400 "Heavy checks" taskset -c "$core" "${command[@]}"
          else
            bash scripts/run-with-budget-warning.sh 18000 "Heavy checks" "${command[@]}"
          fi

      - name: Verify recognition performance targets
        if: inputs.suite == 'recognition-performance'
        env:
          HEAVY_OUT: reports/heavy
          REQUIRE_WASM: '1'
          # The default runner is the reference for absolute single-core time.
          RECOGNITION_COLD_REPORT_ONLY: ${{ inputs.recognition-runner == 'ubuntu-24.04-arm' && '1' || '' }}
        run: |
          mkdir -p "$HEAVY_OUT"
          lscpu > "$HEAVY_OUT/recognition-runner-cpu.txt"
          if [[ -r /sys/fs/cgroup/cpu.max ]]; then
            cat /sys/fs/cgroup/cpu.max >> "$HEAVY_OUT/recognition-runner-cpu.txt"
          fi
          node --test tests/heavy/performance-recognition.test.js

      - name: Profile recognition stages
        if: ${{ !cancelled() && inputs.suite == 'recognition-performance' }}
        run: |
          mkdir -p reports/heavy
          node scripts/profile-recognition.mjs js > reports/heavy/recognition-stages-js.md
          node scripts/profile-recognition.mjs rust > reports/heavy/recognition-stages-rust.md
          node --input-type=module -e 'import { profileSingleCoreRecognition } from "./experiments/issue-77-single-core.mjs"; process.stdout.write(profileSingleCoreRecognition())' > reports/heavy/recognition-stages-cold.txt

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: ./.github/actions/artifact-transport
        with:
          name: heavy-${{ inputs.suite }}-${{ github.run_id }}
          path: reports/heavy
          retention-days: 30
          if-no-files-found: error

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      # Match the heavy job so independent runs cannot cancel each other's gate.
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite == 'recognition' && inputs.limit != '' && format('recognition-{0}', inputs.limit) || inputs.suite == 'recognition-performance' && format('recognition-performance-{0}', inputs.recognition-runner) || inputs.suite }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - heavy
    # actions: read lets the gate list this run's jobs and name the ones
    # GitHub never acquired a runner for.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
